name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14 Release
            preset: linux-gcc-release
            cxx: g++-14
            simd_checks: true
          - name: GCC 14 Debug
            preset: linux-gcc-debug
            cxx: g++-14
          - name: Clang 18 Release
            preset: linux-clang-release
            cxx: clang++-18
            simd_checks: true
          - name: Clang 18 ASan+UBSan
            preset: linux-clang-asan-ubsan
            cxx: clang++-18
          - name: Clang 18 TSan
            preset: linux-clang-tsan
            cxx: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-18
      - name: Limit mmap randomisation for TSan
        if: matrix.preset == 'linux-clang-tsan'
        # LLVM 18 TSan aborts with "unexpected memory mapping" under the runner kernel's default
        # 32-bit mmap entropy.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      # Both kernel tiers (docs/simd.md): the run above uses AVX2 on these runners; the checks below
      # fail if AVX2 is unavailable, re-run every test on the scalar tier and check ISA isolation.
      - name: Require the AVX2 tier
        if: matrix.simd_checks
        run: VF_SIMD=avx2 out/build/${{ matrix.preset }}/apps/cli/vectorforge gen-data --n 1 --dim 8 --out /tmp/vf_simd_probe.npy
      - name: Test (scalar tier)
        if: matrix.simd_checks
        run: VF_SIMD=scalar ctest --preset ${{ matrix.preset }}
      - name: ISA leak check
        if: matrix.simd_checks
        run: python3 tools/check_isa_leak.py out/build/${{ matrix.preset }}

  fuzz-smoke:
    name: Linux Clang 18 index reader fuzz (2 min)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
      - name: Build fuzzer
        run: |
          cmake --preset linux-clang-fuzz -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset linux-clang-fuzz --target vf_fuzz_index_reader_libfuzzer
      - name: Fuzz
        run: tools/fuzz_index_reader.sh out/build/linux-clang-fuzz 120

  windows:
    name: Windows MSVC ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-release, msvc-asan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Require the AVX2 tier
        if: matrix.preset == 'msvc-release'
        run: |
          $env:VF_SIMD = "avx2"
          out/build/msvc-release/apps/cli/vectorforge.exe gen-data --n 1 --dim 8 --out "$env:RUNNER_TEMP/vf_simd_probe.npy"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test (scalar tier)
        if: matrix.preset == 'msvc-release'
        run: |
          $env:VF_SIMD = "scalar"
          ctest --preset msvc-release
      - name: ISA leak check
        if: matrix.preset == 'msvc-release'
        run: python tools/check_isa_leak.py out/build/msvc-release
