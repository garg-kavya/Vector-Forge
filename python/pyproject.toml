[build-system]
requires = ["scikit-build-core==1.0.3", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "vectorforge"
version = "0.1.0"
description = "Exact and HNSW vector similarity search with a C++20 core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.25"
cmake.build-type = "Release"
wheel.packages = ["src/vectorforge"]
# The C++ core is built from the repository root (../), so build from a checkout:
# `pip install ./python`. An sdist of this directory alone would not contain it.
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
VF_WARNINGS_AS_ERRORS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
