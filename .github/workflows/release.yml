name: Release

# Tag v* to publish; run manually with dry_run=true to build every artifact without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts only (no GitHub release, no image push)
        type: boolean
        default: true

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  cli:
    name: CLI and library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-gcc-release
            cxx: g++-14
            archive: tar.gz
          - os: windows-2022
            preset: msvc-release
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build and test
        shell: bash
        run: |
          extra=""
          if [ -n "${{ matrix.cxx }}" ]; then extra="-DCMAKE_CXX_COMPILER=${{ matrix.cxx }}"; fi
          cmake --preset ${{ matrix.preset }} $extra -DVF_BUILD_BENCHMARKS=OFF
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}
      - name: Package
        shell: bash
        run: python tools/package_release.py --build-dir out/build/${{ matrix.preset }} --out dist --format ${{ matrix.archive }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.os }}
          path: dist/

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_ARCHS: auto64
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {project}/python/tests
        run: |
          python -m pip install cibuildwheel==4.2.1
          python -m cibuildwheel python --output-dir wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t vectorforge:release .
      - name: Smoke test
        run: |
          docker run -d --name vf -p 127.0.0.1:8080:8080 vectorforge:release
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 1; done
          bash examples/http/curl_examples.sh http://127.0.0.1:8080
          docker stop vf
      - name: Save image
        run: docker save vectorforge:release | gzip > vectorforge-image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: vectorforge-image.tar.gz
      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag vectorforge:release "$image:$version"
          docker push "$image:$version"

  publish:
    name: GitHub release
    needs: [cli, wheels, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.whl' -o -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
          version="${GITHUB_REF_NAME#v}"
          python tools/release_notes.py "$version" > release-notes.md
      - name: Create release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "VectorForge $GITHUB_REF_NAME" --notes-file release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUBLISH != 'true'
        with:
          name: release-dry-run
          path: |
            release/
            release-notes.md
