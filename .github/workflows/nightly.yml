name: Nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-tsan:
    name: Stress tests x20 (Clang 18 TSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18
      - name: Limit mmap randomisation for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        run: |
          cmake --preset linux-clang-tsan -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset linux-clang-tsan
      - name: Concurrency tests
        run: ctest --preset linux-clang-tsan -L concurrency
      # Fewer repetitions than the Release job below: ThreadSanitizer costs roughly 7x, and one
      # pass of the stress label takes ~80s under TSan on a 4-vCPU runner (RwStress/hnsw alone is
      # ~74s of that), so 100 repetitions would need ~134 min and blow this job's 120 min timeout.
      # TSan is here for race detection, where a few differently-scheduled passes buy most of the
      # signal; the Release job still does the full 100x soak.
      - name: Stress tests, 20 repetitions
        run: ctest --preset linux-clang-tsan -L stress --repeat until-fail:20

  stress-release:
    name: Stress tests x100 (GCC 14 Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          cmake --preset linux-gcc-release -DCMAKE_CXX_COMPILER=g++-14
          cmake --build --preset linux-gcc-release
      - name: Stress tests, 100 repetitions
        run: ctest --preset linux-gcc-release -L stress --repeat until-fail:100
