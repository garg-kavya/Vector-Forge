name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14 Release
            preset: linux-gcc-release
            cxx: g++-14
          - name: GCC 14 Debug
            preset: linux-gcc-debug
            cxx: g++-14
          - name: Clang 18 Release
            preset: linux-clang-release
            cxx: clang++-18
          - name: Clang 18 ASan+UBSan
            preset: linux-clang-asan-ubsan
            cxx: clang++-18
          - name: Clang 18 TSan
            preset: linux-clang-tsan
            cxx: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-18
      - name: Limit mmap randomisation for TSan
        if: matrix.preset == 'linux-clang-tsan'
        # LLVM 18 TSan aborts with "unexpected memory mapping" under the runner kernel's default
        # 32-bit mmap entropy.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: Windows MSVC ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
